; LCDWIKI ES3C28P: 2.8" ESP32-S3 board, ILI9341V 240x320 SPI display, FT6336 capacitive touch.
; Pins from the vendor specification (ES3C28P_ES3N28P_Specification V1.0, section 4.2).
; The USB-C port is the ESP32-S3's own USB, so Serial is a USB CDC port (no USB-serial chip).
[env:es3c28p-wifi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=1
    ; Hardware-dependent settings. Not yet verified on a real board: if the colours look
    ; inverted, delete the next line; if red and blue are swapped, add -DTFT_RGB_ORDER=TFT_RGB.
    -DTFT_INVERSION_ON=1
    ; Screen turned the other way round? Use 3 instead of 1 (and see TOUCH_* in src/main.cpp).
    -DTFT_ROTATION=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
